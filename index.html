<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThatRetirementGuy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111111;
      color: #333;
      overflow-x: hidden;
    }

    header {
      position: relative;
      font-size: 12px;
      padding: 10px;
      text-align: center;
      background-color: #424040;
      color: #ffffff;
    }

    .content-container {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 40px;
      max-width: 100%;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .scroll-box {
      flex: 1;
      overflow: auto;
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background-color: #222222;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar button {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      text-align: left;
      padding: 10px 5px;
      font-size: 16px;
    }

    .sidebar button:hover {
      text-decoration: underline;
    }

    .footer {
      width: 100%;
      background: #000000;
      color: #ffffff;
      font-size: 10px;
      padding: 10px;
      text-align: center;
    }

    .hamburger {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      cursor: pointer;
      user-select: none;
    }

    .menu-bar {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background-color: #222222;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      display: flex;
      flex-direction: column;
      z-index: 50;
    }

    .menu-bar.open {
      max-height: 300px;
    }

    .menu-bar button {
      background: none;
      border: none;
      color: #ffffff;
      padding: 15px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .menu-bar button:hover {
      background: #333333;
    }

    @media (max-width: 768px) {
      .content-container {
        flex-direction: column;
        padding: 15px;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>That Retirement Guy</h1>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <div class="menu-bar" id="menuBar">
    <button onclick="updateContent('about'); toggleMenu()">About</button>
    <button onclick="updateContent('services'); toggleMenu()">Services</button>
    <button onclick="updateContent('contact'); toggleMenu()">Contact</button>
  </div>
</header>

<div class="content-container">
  <div class="sidebar">
    <button onclick="updateContent('about')">About</button>
    <button onclick="updateContent('services')">Services</button>
    <button onclick="updateContent('contact')">Contact</button>
  </div>

  <main>
    <div class="scroll-box" id="content-box">
      <p>Welcome! Select a topic from the sidebar.</p>
    </div>
  </main>
</div>

<div class="footer">
  <p>© 2025 TRG.com</p>
  <p>Contact: Thatretirementguy@gmail.com</p>
  <p>TikTok: @thatretirementguy</p>
</div>

<script>
  const contentBox = document.getElementById("content-box");

  function toggleMenu() {
    document.getElementById("menuBar").classList.toggle("open");
  }

  function updateContent(section) {
    if (section === "about") {
      contentBox.innerHTML = "<h2>About</h2><p>This is the About section. Add your text and images here.</p>";
    } else if (section === "services") {
      contentBox.innerHTML = "<h2>Services</h2><p>Here are the services offered. Describe them here.</p>";
    } else if (section === "contact") {
      contentBox.innerHTML = "<h2>Contact</h2><p>Email: AidanCurtis@gmail.com</p><p>Phone: (optional)</p>";
    } else {
      contentBox.innerHTML = "<p>Welcome! Select a topic from the sidebar.</p>";
    }
  }
</script>

</body>
</html>
